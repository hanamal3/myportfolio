name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets
        run: |
          sed -i "s/__MICROCMS_SERVICE_DOMAIN__/${{ secrets.MICROCMS_SERVICE_DOMAIN }}/g" index.html
          sed -i "s/__MICROCMS_API_KEY__/${{ secrets.MICROCMS_API_KEY }}/g" index.html

      - name: Prepare dist
        run: mkdir dist && cp index.html dist/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist