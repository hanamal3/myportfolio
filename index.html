<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HANAE | Portfolio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #FAFAF8;
      --bg-alt:    #F2EFEA;
      --text:      #1E1C1A;
      --muted:     #6E6B65;
      --accent:    #B8874E;
      --border:    #E5E0D8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    nav { display: flex; gap: 2rem; }
    nav a {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      transition: color 0.2s;
    }
    nav a:hover { color: var(--text); }

    /* ── Hero ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7rem 2rem;
      text-align: center;
    }
    .hero h2 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(3.5rem, 9vw, 6.5rem);
      font-weight: 800;
      letter-spacing: 0.15em;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .hero-sub {
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      color: var(--muted);
    }
    .hero-line {
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin: 1.5rem auto;
    }

    /* ── Section ── */
    section { padding: 5rem 2rem; }
    section.alt { background: var(--bg-alt); }

    .section-header {
      text-align: center;
      margin-bottom: 3.5rem;
    }
    .section-header h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      margin-bottom: 0.75rem;
    }
    .section-header::after {
      content: '';
      display: block;
      width: 32px;
      height: 1px;
      background: var(--accent);
      margin: 0 auto;
    }

    /* ── Works ── */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .work-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .work-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.07);
    }
    .work-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .work-card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .work-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.4rem; }
    .work-desc  { font-size: 0.8rem; color: var(--muted); line-height: 1.6; }
    .work-link  {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--accent);
      border-bottom: 1px solid var(--accent);
      margin-top: auto;
      padding-top: 1rem;
      align-self: flex-start;
      transition: opacity 0.2s;
    }
    .work-link:hover { opacity: 0.7; text-decoration: none; }

    /* ── Skills ── */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem 3rem;
      max-width: 960px;
      margin: 0 auto;
    }
    .skill-item { display: flex; align-items: flex-start; gap: 1rem; }
    .skill-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 0.45rem;
    }
    .skill-name { font-size: 0.88rem; font-weight: 600; margin-bottom: 0.25rem; }
    .skill-desc { font-size: 0.78rem; color: var(--muted); line-height: 1.6; }

    /* ── About ── */
    .about-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3rem;
    }
    @media (min-width: 768px) {
      .about-inner { flex-direction: row; align-items: flex-start; }
    }
    .about-img-wrap { flex-shrink: 0; }
    .about-img-wrap img {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--border);
    }
    .about-text { font-size: 0.88rem; color: var(--muted); line-height: 1.9; }
    .about-text p + p { margin-top: 0.8rem; }

    /* ── Contact ── */
    .contact-inner { text-align: center; }
    .contact-note {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .contact-links { display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; }
    .contact-links a {
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      color: var(--accent);
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }
    .contact-links a:hover { border-color: var(--accent); text-decoration: none; }

    /* ── Footer ── */
    footer {
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--border);
      padding: 2rem;
      border-top: 1px solid var(--border);
    }

    /* ── Loading ── */
    .loading { text-align: center; color: var(--border); font-size: 0.82rem; padding: 2rem; grid-column: 1/-1; }

    @media (max-width: 640px) {
      header { padding: 1.2rem 1.5rem; }
      nav { gap: 1.2rem; }
      .hero { padding: 5rem 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <span class="logo">HANAE</span>
    <nav>
      <a href="#works">WORKS</a>
      <a href="#skill">SKILL</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <div class="hero">
    <h2>HANAE</h2>
    <div class="hero-line"></div>
    <p class="hero-sub">PORTFOLIO</p>
  </div>

  <section id="works" class="alt">
    <div class="section-header"><h3>WORKS</h3></div>
    <div class="works-grid" id="works-grid">
      <p class="loading">読み込み中...</p>
    </div>
  </section>

  <section id="skill">
    <div class="section-header"><h3>SKILL</h3></div>
    <div class="skills-grid" id="skills-grid">
      <p class="loading">読み込み中...</p>
    </div>
  </section>

  <section class="alt">
    <div class="section-header"><h3>ABOUT</h3></div>
    <div class="about-inner" id="about-inner">
      <p class="loading">読み込み中...</p>
    </div>
  </section>

  <section id="contact">
    <div class="section-header"><h3>CONTACT</h3></div>
    <div class="contact-inner">
      <p class="contact-note">お問い合わせは、SNSかメールにてお願いいたします。</p>
      <div class="contact-links" id="contact-links">
        <span class="loading">読み込み中...</span>
      </div>
    </div>
  </section>

  <footer>© HANAE</footer>

  <script>
    const API_BASE = 'https://my-portfolio-1313.microcms.io/api/v1';
    const API_KEY  = 'tvnaBFed6VMzK0ospDcTRMkOYWgEGnczxInx';
    const HEADERS  = { 'X-MICROCMS-API-KEY': API_KEY };

    const SKILL_COLORS = [
      '#C9A87A', '#8EB8A0', '#B89EC9', '#8EA8C9',
      '#C9B88E', '#9EC9A0', '#C98E8E', '#8EC9C4',
      '#C4C98E', '#A88EC9',
    ];

    async function get(endpoint) {
      const res = await fetch(`${API_BASE}/${endpoint}`, { headers: HEADERS });
      if (!res.ok) throw new Error(`${endpoint} fetch failed`);
      return res.json();
    }

    function e(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderWorks(works) {
      const grid = document.getElementById('works-grid');
      if (!works.length) { grid.innerHTML = '<p class="loading">作品はまだありません</p>'; return; }
      grid.innerHTML = works.map(w => `
        <div class="work-card">
          <img src="${w.image.url}" alt="${e(w.title)}" loading="lazy">
          <div class="work-card-body">
            <p class="work-title">${e(w.title)}</p>
            <p class="work-desc">${e(w.description)}</p>
            ${w.link ? `<a class="work-link" href="${e(w.link)}" target="_blank" rel="noopener noreferrer">VIEW SITE →</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    function renderSkills(skills) {
      const grid = document.getElementById('skills-grid');
      const sorted = [...skills].sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
      if (!sorted.length) { grid.innerHTML = '<p class="loading">スキルはまだありません</p>'; return; }
      grid.innerHTML = sorted.map((s, i) => `
        <div class="skill-item">
          <div class="skill-dot" style="background:${SKILL_COLORS[i % SKILL_COLORS.length]}"></div>
          <div>
            <p class="skill-name">${e(s.title)}</p>
            <p class="skill-desc">${e(s.description)}</p>
          </div>
        </div>
      `).join('');
    }

    function renderAbout(about) {
      document.getElementById('about-inner').innerHTML = `
        <div class="about-img-wrap">
          <img src="${about.image.url}" alt="HANAE" loading="lazy">
        </div>
        <div class="about-text">${about.text}</div>
      `;
    }

    function renderContact(contact) {
      const links = [];
      if (contact.instagram) links.push(`<a href="${e(contact.instagram)}" target="_blank" rel="noopener noreferrer">Instagram</a>`);
      if (contact.email)     links.push(`<a href="mailto:${e(contact.email)}">${e(contact.email)}</a>`);
      document.getElementById('contact-links').innerHTML = links.join('') || '<span>-</span>';
    }

    async function init() {
      try {
        const [worksData, skillsData, about, contact] = await Promise.all([
          get('works'), get('skills'), get('about'), get('contact'),
        ]);
        renderWorks(worksData.contents);
        renderSkills(skillsData.contents);
        renderAbout(about);
        renderContact(contact);
      } catch (err) {
        console.error(err);
        document.querySelectorAll('.loading').forEach(el => {
          el.textContent = 'データの読み込みに失敗しました';
        });
      }
    }

    init();
  </script>
</body>
</html>
